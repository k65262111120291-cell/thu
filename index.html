<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCQ Quiz</title>

<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 900px;
        margin: 30px auto;
        padding: 20px;
    }

    .question {
        margin-bottom: 25px;
        padding: 15px;
        border: 1px solid #ddd;
        border-radius: 10px;
    }

    .option {
        display: block;
        width: 100%;
        text-align: left;
        margin: 8px 0;
        padding: 10px;
        cursor: pointer;
        border: 1px solid #ccc;
        border-radius: 6px;
        background: white;
    }

    .option:hover {
        background: #f5f5f5;
    }

    .result {
        font-size: 24px;
        margin-top: 10px;
        font-weight: bold;
    }
</style>
</head>
<body>

<h1>MCQ Quiz</h1>

<div id="quiz"></div>

<script>
const questions = [
{
    q: "What is the capital of France?",
    options: ["Berlin", "Madrid", "Paris", "Rome"],
    answer: 2
},
{
    q: "Which planet is known as the Red Planet?",
    options: ["Earth", "Mars", "Venus", "Jupiter"],
    answer: 1
},
{
    q: "What is 5 + 7?",
    options: ["10", "11", "12", "13"],
    answer: 2
},
{
    q: "Which language runs in a web browser?",
    options: ["Python", "Java", "C++", "JavaScript"],
    answer: 3
},
{
    q: "What is the largest ocean?",
    options: ["Atlantic", "Indian", "Pacific", "Arctic"],
    answer: 2
},
{
    q: "Which company created GitHub?",
    options: ["Google", "Microsoft", "Apple", "Meta"],
    answer: 1
},
{
    q: "HTML stands for?",
    options: [
        "Hyper Text Markup Language",
        "High Text Machine Language",
        "Hyper Transfer Markup Language",
        "Home Tool Markup Language"
    ],
    answer: 0
},
{
    q: "Which is a programming language?",
    options: ["CSS", "HTML", "Python", "XML"],
    answer: 2
},
{
    q: "What year has 366 days?",
    options: ["Leap year", "Normal year", "Every year", "None"],
    answer: 0
},
{
    q: "Which symbol is used for comments in JavaScript?",
    options: ["<!-- -->", "//", "**", "##"],
    answer: 1
}
];

const quiz = document.getElementById("quiz");

questions.forEach((item, index) => {
    const div = document.createElement("div");
    div.className = "question";

    div.innerHTML = `
        <h3>${index + 1}. ${item.q}</h3>
        ${item.options.map((opt, i) =>
            `<button class="option" onclick="checkAnswer(this, ${i}, ${item.answer}, 'result${index}')">
                ${opt}
            </button>`
        ).join("")}
        <div id="result${index}" class="result"></div>
    `;

    quiz.appendChild(div);
});

function checkAnswer(button, selected, correct, resultId) {
    const result = document.getElementById(resultId);

    if (selected === correct) {
        result.innerHTML = "👏 Correct!";
    } else {
        result.innerHTML = "❌ Wrong!";
    }
}
</script>

</body>
</html>
