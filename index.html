<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Marketing Challenge</title>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Times New Roman",serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#1e3a8a,#06b6d4);
overflow:hidden;
padding:20px;
}

.container{
background:white;
width:100%;
max-width:950px;
padding:40px;
border-radius:25px;
box-shadow:0 25px 60px rgba(0,0,0,.25);
animation:fadeIn .8s;
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.title{
text-align:center;
font-size:40px;
font-weight:bold;
color:#1e3a8a;
margin-bottom:20px;
}

.progress-text{
font-size:20px;
font-weight:bold;
margin-bottom:10px;
}

.progress-bar{
height:15px;
background:#e5e7eb;
border-radius:50px;
overflow:hidden;
margin-bottom:20px;
}

.progress{
height:100%;
width:0;
background:linear-gradient(90deg,#2563eb,#06b6d4);
transition:.4s;
}

.top-bar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.timer{
font-size:26px;
font-weight:bold;
color:#dc2626;
}

.question{
font-size:32px;
font-weight:bold;
margin-bottom:25px;
line-height:1.4;
color:#111827;
}

.option{
width:100%;
padding:18px;
margin:12px 0;
font-size:22px;
border:none;
border-radius:15px;
background:#f3f4f6;
cursor:pointer;
transition:.25s;
}

.option:hover{
transform:translateX(8px);
background:#dbeafe;
}

.feedback{
text-align:center;
margin-top:25px;
min-height:100px;
}

.success{
font-size:52px;
font-weight:bold;
color:#16a34a;
animation:pop .5s;
}

.wrong{
font-size:52px;
font-weight:bold;
color:#dc2626;
animation:shake .5s;
}

@keyframes pop{
0%{
transform:scale(.3);
opacity:0;
}
100%{
transform:scale(1);
opacity:1;
}
}

@keyframes shake{
0%,100%{
transform:translateX(0);
}
20%{
transform:translateX(-12px);
}
40%{
transform:translateX(12px);
}
60%{
transform:translateX(-12px);
}
80%{
transform:translateX(12px);
}
}

.next-btn{
display:none;
margin:20px auto;
padding:15px 35px;
font-size:20px;
border:none;
border-radius:12px;
background:#2563eb;
color:white;
cursor:pointer;
}

.next-btn:hover{
background:#1d4ed8;
}

.correct-flash{
animation:greenFlash .7s;
}

.wrong-flash{
animation:redFlash .5s;
}

@keyframes greenFlash{
0%{
background:#22c55e;
}
100%{
background:linear-gradient(135deg,#1e3a8a,#06b6d4);
}
}

@keyframes redFlash{
0%{
background:#ef4444;
}
100%{
background:linear-gradient(135deg,#1e3a8a,#06b6d4);
}
}

.result{
text-align:center;
animation:fadeIn 1s;
}

.score{
font-size:80px;
font-weight:bold;
color:#2563eb;
margin:20px 0;
}

.message{
font-size:30px;
font-weight:bold;
}

</style>
</head>
<body>

<div class="container">

<div id="quiz">

<div class="title">
📈 MARKETING CHALLENGE
</div>

<div class="progress-text"></div>

<div class="progress-bar">
<div class="progress"></div>
</div>

<div class="top-bar">
<div></div>
<div class="timer">15</div>
</div>

<div class="question"></div>

<div class="options"></div>

<div class="feedback"></div>

<center>
<button class="next-btn">
Next Question →
</button>
</center>

</div>

</div>

<script>

const questions=[

{
question:"What is market segmentation?",
options:[
"Dividing a market into groups",
"Reducing prices",
"Hiring employees",
"Creating logos"
],
answer:0
},

{
question:"Which P of marketing mix refers to advertising?",
options:[
"Product",
"Price",
"Promotion",
"Place"
],
answer:2
},

{
question:"Nike mainly uses which promotional strategy?",
options:[
"Celebrity endorsement",
"Cold calling",
"Door-to-door selling",
"Telemarketing"
],
answer:0
},

{
question:"What does SWOT stand for?",
options:[
"Strengths Weaknesses Opportunities Threats",
"Sales Work Operations Target",
"Strategy Work Objectives Tactics",
"None"
],
answer:0
},

{
question:"Branding means...",
options:[
"Building a unique identity",
"Paying taxes",
"Warehouse management",
"Recruitment"
],
answer:0
}

];

let current=0;
let score=0;
let timeLeft=15;
let timer;

const questionEl=document.querySelector(".question");
const optionsEl=document.querySelector(".options");
const feedbackEl=document.querySelector(".feedback");
const nextBtn=document.querySelector(".next-btn");
const progress=document.querySelector(".progress");
const progressText=document.querySelector(".progress-text");
const timerEl=document.querySelector(".timer");

function startTimer(){

clearInterval(timer);

timeLeft=15;

timerEl.innerHTML=timeLeft;

timer=setInterval(()=>{

timeLeft--;

timerEl.innerHTML=timeLeft;

if(timeLeft<=0){

clearInterval(timer);

feedbackEl.innerHTML=
`<div class="wrong">⏰ TIME UP!</div>`;

nextBtn.style.display="block";

document.querySelectorAll(".option")
.forEach(btn=>btn.disabled=true);

}

},1000);

}

function loadQuestion(){

feedbackEl.innerHTML="";
nextBtn.style.display="none";

let q=questions[current];

progressText.innerHTML=
`Question ${current+1} of ${questions.length}`;

progress.style.width=
`${(current/questions.length)*100}%`;

questionEl.innerHTML=q.question;

optionsEl.innerHTML="";

q.options.forEach((option,index)=>{

const btn=document.createElement("button");

btn.classList.add("option");

btn.innerHTML=option;

btn.onclick=()=>checkAnswer(index);

optionsEl.appendChild(btn);

});

startTimer();

}

function checkAnswer(selected){

clearInterval(timer);

const correct=
questions[current].answer;

document.querySelectorAll(".option")
.forEach(btn=>btn.disabled=true);

if(selected===correct){

score++;

feedbackEl.innerHTML=
`
<div class="success">
🎉 AMAZING!<br>
👏 CORRECT!
</div>
`;

confetti({
particleCount:250,
spread:180,
origin:{y:.6}
});

document.body.classList.add("correct-flash");

setTimeout(()=>{
document.body.classList.remove("correct-flash");
},700);

}else{

feedbackEl.innerHTML=
`
<div class="wrong">
💥 OOPS!<br>
❌ WRONG!
</div>
`;

document.body.classList.add("wrong-flash");

setTimeout(()=>{
document.body.classList.remove("wrong-flash");
},500);

}

nextBtn.style.display="block";

}

nextBtn.addEventListener("click",()=>{

current++;

if(current<questions.length){

loadQuestion();

}else{

showResult();

}

});

function showResult(){

let message="";

if(score===questions.length){

message="🏆 PERFECT MARKETER!";
}
else if(score>=questions.length*0.7){

message="🌟 GREAT JOB!";
}
else{

message="📚 KEEP LEARNING!";
}

document.getElementById("quiz").innerHTML=

`
<div class="result">

<h1>🎊 QUIZ COMPLETED 🎊</h1>

<div class="score">
${score}/${questions.length}
</div>

<div class="message">
${message}
</div>

<br><br>

<h2>
Thank you for participating!
</h2>

</div>
`;

confetti({
particleCount:500,
spread:360
});

}

loadQuestion();

</script>

</body>
</html>
