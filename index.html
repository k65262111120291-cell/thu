<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Marketing Quiz</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:linear-gradient(135deg,#4f46e5,#06b6d4);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.container{
background:white;
width:100%;
max-width:850px;
padding:40px;
border-radius:20px;
box-shadow:0 20px 40px rgba(0,0,0,0.15);
}

h1{
text-align:center;
margin-bottom:20px;
color:#1f2937;
}

.progress-text{
margin-bottom:10px;
font-weight:600;
}

.progress-bar{
height:12px;
background:#e5e7eb;
border-radius:999px;
overflow:hidden;
margin-bottom:30px;
}

.progress{
height:100%;
width:0%;
background:#4f46e5;
transition:0.4s;
}

.question{
font-size:1.4rem;
font-weight:700;
margin-bottom:25px;
color:#111827;
}

.option{
width:100%;
padding:15px;
margin:10px 0;
border:none;
border-radius:12px;
background:#f3f4f6;
cursor:pointer;
font-size:16px;
transition:0.3s;
}

.option:hover{
background:#dbeafe;
transform:translateX(5px);
}

.feedback{
text-align:center;
font-size:28px;
margin-top:20px;
font-weight:bold;
min-height:50px;
}

.next-btn{
display:none;
margin:20px auto 0;
padding:12px 30px;
border:none;
background:#4f46e5;
color:white;
border-radius:10px;
cursor:pointer;
font-size:16px;
}

.next-btn:hover{
background:#4338ca;
}

.result{
text-align:center;
}

.score{
font-size:3rem;
margin:20px 0;
font-weight:bold;
color:#4f46e5;
}

</style>
</head>
<body>

<div class="container">

<h1>📈 Marketing Quiz Challenge</h1>

<div id="quiz">

<div class="progress-text"></div>

<div class="progress-bar">
<div class="progress"></div>
</div>

<div class="question"></div>

<div class="options"></div>

<div class="feedback"></div>

<button class="next-btn">Next Question →</button>

</div>

</div>

<script>

const questions = [

{
question:"What is market segmentation?",
options:[
"Dividing a market into groups",
"Reducing prices",
"Hiring employees",
"Creating logos"
],
answer:0
},

{
question:"Which P of marketing mix refers to advertising?",
options:[
"Product",
"Price",
"Promotion",
"Place"
],
answer:2
},

{
question:"Nike mainly uses which promotional strategy?",
options:[
"Celebrity endorsement",
"Door-to-door selling",
"Cold calling",
"Fax marketing"
],
answer:0
},

{
question:"What does SWOT stand for?",
options:[
"Strengths Weaknesses Opportunities Threats",
"Sales Work Operations Target",
"Strategy Work Objectives Tactics",
"None"
],
answer:0
},

{
question:"What is branding?",
options:[
"Building a unique identity",
"Shipping products",
"Paying taxes",
"Warehouse management"
],
answer:0
}

];

let current=0;
let score=0;

const questionEl=document.querySelector(".question");
const optionsEl=document.querySelector(".options");
const feedbackEl=document.querySelector(".feedback");
const nextBtn=document.querySelector(".next-btn");
const progress=document.querySelector(".progress");
const progressText=document.querySelector(".progress-text");

function loadQuestion(){

feedbackEl.innerHTML="";
nextBtn.style.display="none";

let q=questions[current];

progressText.innerHTML=
`Question ${current+1} of ${questions.length}`;

progress.style.width=
`${((current)/questions.length)*100}%`;

questionEl.innerHTML=q.question;

optionsEl.innerHTML="";

q.options.forEach((option,index)=>{

const btn=document.createElement("button");

btn.classList.add("option");

btn.innerText=option;

btn.onclick=()=>checkAnswer(index);

optionsEl.appendChild(btn);

});

}

function checkAnswer(selected){

let correct=questions[current].answer;

document.querySelectorAll(".option")
.forEach(btn=>btn.disabled=true);

if(selected===correct){

score++;

feedbackEl.innerHTML="👏 Correct!";

}else{

feedbackEl.innerHTML="❌ Incorrect!";
}

nextBtn.style.display="block";
}

nextBtn.addEventListener("click",()=>{

current++;

if(current<questions.length){

loadQuestion();

}else{

showResult();

}

});

function showResult(){

document.getElementById("quiz").innerHTML=`

<div class="result">

<h1>🎉 Quiz Completed</h1>

<div class="score">
${score}/${questions.length}
</div>

<p>Thank you for participating!</p>

</div>

`;

}

loadQuestion();

</script>

</body>
</html>
